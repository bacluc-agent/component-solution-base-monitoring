parameters:
  solution_base_monitoring:
    =_metadata:
      multi_tenant: true
      multi_instance: true
      multi_version: true
    namespace: ${_instance}

    createNamespace: true
    namespaceAnnotations: {}
    namespaceLabels: {}

    monitor_namespaces:
      label: vshn_net_solution_monitoring
      label_value: ${_instance}

    thresholds:
      rate_window: 5m
      container_oom_killed_window: 10m
      container_oom_killed_restart: 1
      container_oom_killed_for: 15m
      container_memory_usage_high: 0.9
      container_memory_usage_high_for: 30m
      container_cpu_usage_high: 0.9
      container_cpu_usage_high_for: 30m
      container_memory_requests_too_high: 0.2
      container_memory_requests_too_high_minimum: 50
      container_memory_requests_too_high_for: 36h
      container_cpu_requests_too_high: 0.2
      container_cpu_requests_too_high_minimum: 0.05
      container_cpu_requests_too_high_for: 36h
      container_readiness_flap_changes: 4
      container_readiness_flap_window: 15m
      container_readiness_flap_for: 15m
      k8up_job_window: 36h
      k8up_job_for: 1h
      kube_namespace_not_active_for: 5m

    prometheusRules:
      solution-base-rules:
        spec:
          groups:
            resource-rules:
              rules:

                KubeContainerOOMKilled:
                  annotations:
                    description: |
                      Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} was OOMKilled.
                      The container's last termination reason was OOMKilled. This usually indicates that the container exceeded its memory limit or the node was under memory pressure.
                      Inspect the pod with: oc describe -n {{ $labels.namespace }} pod {{ $labels.pod }}
                    summary: Container was OOMKilled.
                  expr: |
                    (
                      (
                        (kube_pod_container_status_restarts_total{job="kube-state-metrics"}
                        %(namespaceLabelFilter)s)
                        -
                        (kube_pod_container_status_restarts_total{job="kube-state-metrics"} offset %(container_oom_killed_window)s)
                      ) >= %(container_oom_killed_restart)s
                      and ignoring(reason)
                      (min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled", job="kube-state-metrics"}[%(container_oom_killed_window)s]) == 1)
                    )
                    %(teamJoin)s
                  for: "%(container_oom_killed_for)s"
                  labels:
                    severity: warning
                KubeContainerMemoryUsageHigh:
                  annotations:
                    description: |
                      Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} is using more than 90% of its memory limit for more than 30 minutes.
                      This container is at risk of being OOMKilled. Consider raising the memory limit or investigating the memory usage.
                    summary: Container memory usage is above 90% of its limit.
                  expr: |
                    (
                      (
                        (
                          sum by (namespace, pod, container, cluster) (
                            container_memory_working_set_bytes{container!="",container!="POD",job="kubelet",metrics_path="/metrics/cadvisor"}
                          )
                          %(namespaceLabelFilter)s
                        )
                        /
                        on (namespace, pod, container, cluster)
                        sum by (namespace, pod, container, cluster) (
                          container_spec_memory_limit_bytes{container!="",container!="POD",job="kubelet",metrics_path="/metrics/cadvisor"}
                        )
                      ) > %(container_memory_usage_high)s
                      and on (namespace, pod, container, cluster)
                      (
                        sum by (namespace, pod, container, cluster) (
                          container_spec_memory_limit_bytes{container!="",container!="POD",job="kubelet",metrics_path="/metrics/cadvisor"}
                        ) > 0
                      )
                    )
                    %(teamJoin)s
                  for: "%(container_memory_usage_high_for)s"
                  labels:
                    severity: warning
                KubeContainerCPUUsageHigh:
                  annotations:
                    description: |
                      Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} is using more than 90% of its CPU limit for more than 30 minutes.
                      This container is likely being CPU throttled. Consider raising the CPU limit or investigating the CPU usage.
                    summary: Container CPU usage is above 90% of its limit.
                  expr: |
                    (
                      (
                        (
                          sum by (namespace, pod, container, cluster) (
                            rate(container_cpu_usage_seconds_total{container!="",container!="POD",job="kubelet",metrics_path="/metrics/cadvisor"}[%(rate_window)s])
                          )
                          %(namespaceLabelFilter)s
                        )
                        /
                        on (namespace, pod, container, cluster)
                        sum by (namespace, pod, container, cluster) (
                          container_spec_cpu_quota{container!="",container!="POD",job="kubelet",metrics_path="/metrics/cadvisor"}
                          /
                          container_spec_cpu_period{container!="",container!="POD",job="kubelet",metrics_path="/metrics/cadvisor"}
                        )
                      ) > %(container_cpu_usage_high)s
                      and on (namespace, pod, container, cluster)
                      (
                        sum by (namespace, pod, container, cluster) (
                          container_spec_cpu_quota{container!="",container!="POD",job="kubelet",metrics_path="/metrics/cadvisor"}
                        ) > 0
                      )
                    )
                    %(teamJoin)s
                  for: "%(container_cpu_usage_high_for)s"
                  labels:
                    severity: warning
                KubeContainerMemoryRequestsTooHigh:
                  annotations:
                    description: |
                      Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} consistently uses less than 20% of its memory request.
                      The memory request may be too high and could be reduced to free up schedulable resources.
                    summary: Container memory request is too high.
                  expr: |
                    (
                      (
                        (
                          sum by (namespace, pod, container, cluster) (
                            container_memory_working_set_bytes{container!="",container!="POD",job="kubelet",metrics_path="/metrics/cadvisor"}
                          )
                          %(namespaceLabelFilter)s
                        )
                        /
                        on (namespace, pod, container, cluster)
                        sum by (namespace, pod, container, cluster) (
                          kube_pod_container_resource_requests{resource="memory", job="kube-state-metrics"}
                        )
                      ) < %(container_memory_requests_too_high)s
                      and on (namespace, pod, container, cluster)
                      (
                        sum by (namespace, pod, container, cluster) (
                          kube_pod_container_resource_requests{resource="memory", job="kube-state-metrics"}
                        ) >= %(container_memory_requests_too_high_minimum)s * 1024 * 1024
                      )
                    )
                    %(teamJoin)s
                  for: "%(container_memory_requests_too_high_for)s"
                  labels:
                    severity: warning
                KubeContainerCPURequestsTooHigh:
                  annotations:
                    description: |
                      Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} consistently uses less than 20% of its CPU request.
                      The CPU request may be too high and could be reduced to free up schedulable resources.
                    summary: Container CPU request is too high.
                  expr: |
                    (
                      (
                        (
                          sum by (namespace, pod, container, cluster) (
                            rate(container_cpu_usage_seconds_total{container!="",container!="POD",job="kubelet",metrics_path="/metrics/cadvisor"}[%(rate_window)s])
                          )
                          %(namespaceLabelFilter)s
                        )
                        /
                        on (namespace, pod, container, cluster)
                        sum by (namespace, pod, container, cluster) (
                          kube_pod_container_resource_requests{resource="cpu", job="kube-state-metrics"}
                        )
                      ) < %(container_cpu_requests_too_high)s
                      and on (namespace, pod, container, cluster)
                      (
                        sum by (namespace, pod, container, cluster) (
                          kube_pod_container_resource_requests{resource="cpu", job="kube-state-metrics"}
                        ) >= %(container_cpu_requests_too_high_minimum)s
                      )
                    )
                    %(teamJoin)s
                  for: "%(container_cpu_requests_too_high_for)s"
                  labels:
                    severity: warning

            status-rules:
              rules:

                KubeContainerReadinessFlap:
                  annotations:
                    description: |
                      Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} is flapping between ready and not ready.
                      The readiness state changed repeatedly within the last 15 minutes and the container is currently not ready.
                      Check the readiness probe configuration and the container's dependencies.
                    summary: Container readiness is flapping.
                  expr: |
                    (
                      (changes(kube_pod_container_status_ready{job="kube-state-metrics"}[%(container_readiness_flap_window)s]) >= %(container_readiness_flap_changes)s)
                      %(namespaceLabelFilter)s
                      and on (namespace, pod, container, cluster)
                      (kube_pod_container_status_ready{job="kube-state-metrics"} == 0)
                    )
                    %(teamJoin)s
                  for: "%(container_readiness_flap_for)s"
                  labels:
                    severity: warning

            backup-rules:
              rules:
                K8upJob:
                  annotations:
                    description: |
                      There was no successful "{{ $labels.jobType }}" job in the
                      last 36 hours in the `{{ $labels.namespace }}` namespace.
                    summary: No successful "{{ $labels.jobType }}" job in the last 36h
                  expr: |
                    (
                      sum by (namespace, jobType) (
                        label_replace(
                          rate(k8up_jobs_successful_counter[%(k8up_job_window)s]),
                          "namespace", "$1", "exported_namespace", "(.*)"
                        )
                      ) == 0
                      %(namespaceLabelFilter)s
                    )
                    %(teamJoin)s
                  for: "%(k8up_job_for)s"
                  labels:
                    severity: info

            kube-state-rules:
              rules:
                KubeNamespaceNotActive:
                  annotations:
                    description: |
                      Namespace {{ $labels.namespace }} is in phase {{ $labels.phase }}.
                    summary: Namespace is not Active.
                  expr: |
                    (
                      kube_namespace_status_phase{job="kube-state-metrics", phase!="Active"} == 1
                      %(namespaceLabelFilter)s
                    )
                    %(teamJoin)s
                  for: "%(kube_namespace_not_active_for)s"
                  labels:
                    severity: warning

    alertNamePrefix: SB
